name: Deploy to Firebase Hosting

# Every push to main builds the site and publishes it to https://mathit-liorhen9.web.app
# (Firebase project mathit-liorhen9, as ChessIt does with its own project).
# Needs the FIREBASE_SERVICE_ACCOUNT secret with the "Firebase Hosting Admin" role
# (docs/FIREBASE.md, parts ב–ג).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  FIREBASE_PROJECT: mathit-liorhen9

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the deploy key
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing the FIREBASE_SERVICE_ACCOUNT secret – see docs/FIREBASE.md, part ב"
            exit 1
          fi
          # A key from another Firebase project (ChessIt's, say) would publish to the wrong place.
          key_project=$(printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | jq -r '.project_id // empty' 2>/dev/null || true)
          if [ "$key_project" != "$FIREBASE_PROJECT" ]; then
            echo "::error::The FIREBASE_SERVICE_ACCOUNT key is for project '${key_project:-?}', not '$FIREBASE_PROJECT' – see docs/FIREBASE.md"
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        # Firebase serves the site at the root of the domain, so the default base (/) is right.
        run: npm run build

      # Phase 10: the worker waits for "update" (it must listen for SKIP_WAITING), the page has its
      # share card, and the app does not register a second worker of its own.
      - name: Check the build
        run: |
          grep -q SKIP_WAITING dist/sw.js
          grep -q 'og:image' dist/index.html
          grep -q "https://$FIREBASE_PROJECT.web.app/og-image.png" dist/index.html
          ! grep -q registerSW dist/index.html
          ! grep -q 'github.io' dist/index.html
          test -f dist/og-image.png
          test -f dist/manifest.webmanifest

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.FIREBASE_PROJECT }}
          channelId: live
